# Meetvault_Backend deployment: Postgres + API + worker, one image each.
#
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up -d --build
#   TOKEN=$(curl -fsS -X POST http://localhost:8080/v1/auth/login \
#     -H 'Content-Type: application/json' \
#     -d '{"email":"you@example.com","password":"..."}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
#   curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/v1/system/info
#
# The api service runs the migrations before serving; the worker waits for the api to
# become healthy, so migrations are never applied twice concurrently.
name: meetvault-backend

x-app-env: &app-env
  MVB_ENV: prod
  MVB_DATABASE_URL: postgresql+psycopg://mvb:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mvb
  MVB_MEDIA_ROOT: /data/media
  MVB_MAX_UPLOAD_MB: ${MVB_MAX_UPLOAD_MB:-4096}
  MVB_JOB_STALE_SECONDS: ${MVB_JOB_STALE_SECONDS:-900}
  MVB_WORKER_POLL_SECONDS: ${MVB_WORKER_POLL_SECONDS:-2}
  MVB_TRANSCRIBER: ${MVB_TRANSCRIBER:-mock}
  MVB_TRANSCRIBER_MODEL: ${MVB_TRANSCRIBER_MODEL:-small}
  MVB_DIARIZER: ${MVB_DIARIZER:-mock}
  MVB_ANALYZER: ${MVB_ANALYZER:-mock}
  MVB_ANALYZER_MODEL: ${MVB_ANALYZER_MODEL:-}
  MVB_ANALYZER_TIMEOUT_S: ${MVB_ANALYZER_TIMEOUT_S:-120}
  MVB_LMSTUDIO_BASE_URL: ${MVB_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
  MVB_LMSTUDIO_API_KEY: ${MVB_LMSTUDIO_API_KEY:-}
  MVB_OPENCODE_GO_BASE_URL: ${MVB_OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
  MVB_OPENCODE_GO_API_KEY: ${MVB_OPENCODE_GO_API_KEY:-}
  MVB_LOG_LEVEL: ${MVB_LOG_LEVEL:-INFO}
  # Set MVB_HF_TOKEN to use the real pyannote diarizer. Never commit a real token.
  HF_TOKEN: ${MVB_HF_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mvb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mvb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvb -d mvb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment: *app-env
      # The image ENTRYPOINT applies `alembic upgrade head` (idempotent) before
      # every command, so no per-service migration command is needed.
    ports:
      - "${MVB_PORT:-8080}:8080"
    volumes:
      - media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach LM Studio / OpenCode on the host
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    environment: *app-env
    command: ["python", "-m", "mvb.jobs.worker"]
    volumes:
      - media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy # migrations are already applied by the api service
    restart: unless-stopped

volumes:
  pgdata:
  media:
