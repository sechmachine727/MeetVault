[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetvault-backend"
version = "0.1.0"
description = "REST backend for MeetVault: post-meeting transcription, diarization and LLM analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "SQLAlchemy>=2.0.36",
  "alembic>=1.14",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "python-json-logger>=2.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# Postgres driver: needed for the Docker/compose deployment and CI's postgres job.
prod = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "respx>=0.21",
]
transcribe = [
  "faster-whisper>=1.0",
  # faster-whisper 1.2.x decodes through `av.open(..., metadata_errors="ignore")`, an
  # argument PyAV removed in 19.0. Its own constraint is only `av>=11`, so without this pin a
  # fresh install (the Docker image is the one that matters) resolves av 19 and every real
  # transcription fails with "TypeError: open() got an unexpected keyword argument
  # 'metadata_errors'" — the mock never touches av, so nothing else catches it.
  "av<19",
]
diarize = ["pyannote.audio>=3.3", "torch>=2.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/mvb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "e2e: full pipeline end-to-end (slow, hermetic with mock providers)",
  "live_provider: needs a real AI engine (skipped unless MVB_RUN_LIVE=1)",
  "docker: needs a Docker daemon (skipped unless MVB_RUN_DOCKER=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RET", "ARG", "TID", "RUF"]
ignore = ["E501"]   # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
# Protocol implementations must keep the interface signature even when an argument is unused.
"src/mvb/providers/**" = ["ARG002"]
"src/mvb/main.py" = ["ARG001"]
"src/mvb/api/errors.py" = ["ARG001"]
"tests/**" = ["ARG001", "ARG002"]

